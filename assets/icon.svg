<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B85FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58CC02;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Subtle pattern circles in background -->
  <circle cx="180" cy="180" r="120" fill="rgba(255,255,255,0.06)"/>
  <circle cx="850" cy="850" r="150" fill="rgba(255,255,255,0.06)"/>
  <circle cx="800" cy="200" r="80" fill="rgba(255,255,255,0.04)"/>

  <!-- Speech bubble shape -->
  <g filter="url(#shadow)">
    <path d="M 280 280
             Q 280 220, 340 220
             L 684 220
             Q 744 220, 744 280
             L 744 520
             Q 744 580, 684 580
             L 480 580
             L 400 680
             L 420 580
             L 340 580
             Q 280 580, 280 520 Z"
          fill="white" opacity="0.95"/>
  </g>

  <!-- Letter "L" stylized -->
  <text x="390" y="480" font-family="Arial, Helvetica, sans-serif" font-size="240" font-weight="900" fill="url(#bg)" letter-spacing="-5">
    L
  </text>

  <!-- Small globe/language icon -->
  <circle cx="600" cy="400" r="65" fill="url(#accent)" opacity="0.9"/>
  <ellipse cx="600" cy="400" rx="65" ry="65" fill="none" stroke="white" stroke-width="3" opacity="0.6"/>
  <ellipse cx="600" cy="400" rx="30" ry="65" fill="none" stroke="white" stroke-width="3" opacity="0.6"/>
  <line x1="535" y1="400" x2="665" y2="400" stroke="white" stroke-width="3" opacity="0.6"/>
  <line x1="545" y1="365" x2="655" y2="365" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="545" y1="435" x2="655" y2="435" stroke="white" stroke-width="2" opacity="0.4"/>

  <!-- Stars decoration -->
  <g fill="#FFC800" opacity="0.9">
    <polygon points="160,650 170,680 200,680 175,698 185,728 160,710 135,728 145,698 120,680 150,680" />
    <polygon points="830,350 838,372 860,372 842,386 850,408 830,394 810,408 818,386 800,372 822,372" transform="scale(0.8) translate(200, 80)"/>
    <polygon points="750,650 758,672 780,672 762,686 770,708 750,694 730,708 738,686 720,672 742,672" transform="scale(0.7) translate(350, 250)"/>
  </g>

  <!-- Bottom text "LinguaLeap" -->
  <text x="512" y="830" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle" letter-spacing="3" opacity="0.95">
    LinguaLeap
  </text>

  <!-- Subtle underline accent -->
  <rect x="300" y="848" width="424" height="6" rx="3" fill="url(#accent)" opacity="0.8"/>
</svg>
